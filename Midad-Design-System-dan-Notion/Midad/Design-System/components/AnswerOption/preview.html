<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>AnswerOption — preview</title></head>
<body>
<div class="md-demo" style="max-width:420px">
  <div class="md-col" style="width:100%">
    <span class="md-cap">Default · Terpilih · Benar · Salah</span>
    <button class="md-option"><span class="md-option__key">1</span><span class="md-option__text md-option__ar" lang="ar">بَيْتٌ</span></button>
    <button class="md-option is-selected" aria-pressed="true"><span class="md-option__key">2</span><span class="md-option__text md-option__ar" lang="ar">كِتَابٌ</span></button>
    <button class="md-option is-correct"><span class="md-option__key"><svg class="md-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="md-option__text md-option__ar" lang="ar">قَلَمٌ</span></button>
    <button class="md-option is-wrong"><span class="md-option__key"><svg class="md-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="md-option__text md-option__ar" lang="ar">مَكْتَبٌ</span></button>
  </div>
</div>
</body>
</html>

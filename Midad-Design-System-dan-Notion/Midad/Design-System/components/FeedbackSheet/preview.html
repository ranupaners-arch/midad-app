<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>FeedbackSheet — preview</title></head>
<body>
<div class="md-col" style="max-width:440px;gap:var(--space-4)">
  <div class="md-sheet md-sheet--correct" role="status">
    <div class="md-sheet__head"><span class="md-sheet__badge"><svg class="md-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><p class="md-sheet__title">مُمْتَاز!</p></div>
    <button class="md-btn md-btn--success md-btn--block">مُتَابَعَة</button>
  </div>
  <div class="md-sheet md-sheet--wrong" role="alert">
    <div class="md-sheet__head"><span class="md-sheet__badge"><svg class="md-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span><p class="md-sheet__title">الإِجَابَةُ الصَّحِيحَةُ:</p><button class="md-tr-btn md-tr-btn--icon" aria-pressed="true" aria-label="تَرْجَمَة"><svg class="md-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3" width="11" height="11" rx="2.5"/><path d="M10.5 10v7a2.5 2.5 0 0 0 2.5 2.5h6a2.5 2.5 0 0 0 2.5-2.5v-6A2.5 2.5 0 0 0 19 8.5h-5.5"/><path d="M5.5 11l2.5-6 2.5 6M6.3 9h3.4"/><path d="M14.5 17.5l2.5-6 2.5 6M15.3 15.5h3.4"/></svg></button></div>
    <p class="md-sheet__body"><span class="md-sheet__ar" lang="ar">هٰذَا بَيْتٌ كَبِيْرٌ</span><span class="md-tr" lang="id">Ini rumah yang besar.</span></p>
    <button class="md-btn md-btn--danger md-btn--block">فَهِمْتُ</button>
  </div>
</div>
</body>
</html>

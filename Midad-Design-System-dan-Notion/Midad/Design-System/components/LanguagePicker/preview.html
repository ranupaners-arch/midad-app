<!-- @dsCard group="Bahasa" height=460 subtitle="Onboarding: pilih bahasa ibu" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>LanguagePicker — preview</title></head>
<body>
<div class="md-demo" style="max-width:420px">
  <div class="md-col" style="width:100%;gap:var(--space-4)">
    <div><p class="md-q__title">مَا لُغَتُكَ الأُمُّ؟</p><span class="md-tr md-tr--sm" lang="id">Apa bahasa ibumu?</span><span class="md-tr md-tr--sm" lang="en">What is your native language?</span></div>
    <div class="md-lang" role="radiogroup" aria-label="اللُّغَةُ الأُمُّ">
      <button class="md-lang__opt" role="radio" aria-checked="true"><span class="md-lang__code">ID</span><span class="md-lang__name"><span class="md-lang__native" lang="id">Bahasa Indonesia</span><span class="md-lang__ar">الإِنْدُونِيسِيَّة</span></span><span class="md-lang__radio"></span></button>
      <button class="md-lang__opt" role="radio" aria-checked="false"><span class="md-lang__code">EN</span><span class="md-lang__name"><span class="md-lang__native" lang="en">English</span><span class="md-lang__ar">الإِنْجِلِيزِيَّة</span></span><span class="md-lang__radio"></span></button>
      <div class="md-lang__opt is-soon" aria-disabled="true"><span class="md-lang__code">…</span><span class="md-lang__name"><span class="md-lang__ar">لُغَاتٌ أُخْرَى قَرِيبًا</span></span></div>
    </div>
    <button class="md-btn md-btn--block">مُتَابَعَة</button>
  </div>
</div>
</body>
</html>

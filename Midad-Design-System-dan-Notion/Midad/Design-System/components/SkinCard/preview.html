  ['koko','rare','قَمِيصُ كُوكُو','نَادِرٌ','٤٠٠ تَمْرَة'],['nakhoda','epic','زِيُّ النُّوخِذَةِ','مَلْحَمِيٌّ','إِنْهَاءُ كِتَابٍ'],['scholar','epic','جُبَّةُ العَالِمِ','مَلْحَمِيٌّ','سِلْسِلَةُ ٣٠ يَوْمًا'],['goldbisht','legendary','البِشْتُ الذَّهَبِيُّ','أُسْطُورِيٌّ','إِنْهَاءُ الكُتُبِ الأَرْبَعَةِ'],['nightink','legendary','مِدَادُ اللَّيْلِ','أُسْطُورِيٌّ','حَدَثُ ١٨ دِيسَمْبِر']];

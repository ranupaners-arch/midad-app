<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Vehicles — preview</title></head>
<body>
<div class="md-demo" id="vv" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)"></div>
<script src="../../assets/Maskot/mascot.js"></script>
<script src="../../assets/Maskot/vehicles.js"></script>
<script>
var A = ['hudhud','cat','camel','turtle','oryx'];
document.getElementById('vv').innerHTML = Object.keys(MidadVehicles.V).map(function (k, i) { var v = MidadVehicles.V[k]; return '<div class="md-col" style="gap:var(--space-1)"><div class="md-hijrah" style="width:100%">' + MidadVehicles.ride(k, { animal: A[i % 5] }) + '</div><b style="font-family:var(--font-arabic);font-size:18px">' + v.name[0] + '</b><span class="md-cap">' + v.name[1] + '</span></div>'; }).join('');
</script>
</body>
</html>

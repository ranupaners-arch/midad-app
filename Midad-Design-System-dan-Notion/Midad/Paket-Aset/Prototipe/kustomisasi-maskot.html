<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midad — صمّم رفيقك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* VOICE: warm, playful app screen for young learners; Arabic-first, calm.
   IDEA: a dressing-room mirror inside the Midad app — the mascot stands on a stage, parts below.
   PICTURE: the live mascot itself, large, on a soft teal stage.
   COLOUR and TYPE: Midad tokens — cream paper, teal ink, gold, date brown; IBM Plex Sans Arabic UI, Noto Naskh for vocab, Nunito for numbers/translation.
   LAYOUT: one 480px phone column: header, stage, animal row, slot tabs, option grid, sticky save bar. */
:root{color-scheme:light dark;
--s0:light-dark(#fbf6ec,#101817);--s1:light-dark(#ffffff,#18231f);--s2:light-dark(#f2eadb,#22302c);
--line:light-dark(#e6dcc8,#33443f);--line2:light-dark(#cdbfa5,#4b5f59);
--ink:light-dark(#2a211a,#f4eee4);--muted:light-dark(#6b5d4f,#b5ab9b);--subtle:light-dark(#9c8d7b,#7d8a84);
--brand:light-dark(#0f766e,#2fb8a6);--brand2:light-dark(#0b5a54,#1f8f81);--brandsoft:light-dark(#d6efeb,#133c37);--brandink:light-dark(#0b5a54,#7fe0d2);--onbrand:light-dark(#ffffff,#04201d);
--gold:light-dark(#e9b949,#f0c55e);--goldsoft:light-dark(#fbefcc,#3a2f12);
--date:light-dark(#7c4a2d,#d29a70);--datesoft:light-dark(#f3e3d6,#3a271b);
--danger:light-dark(#c44530,#f07a63);--focus:light-dark(#1d4ed8,#8ab4ff);
--ui:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif;--ar:"Noto Naskh Arabic","Amiri",serif;--lat:"Nunito","Segoe UI",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--s0);color:var(--ink);font:500 16px/1.6 var(--ui);overflow-x:clip}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:8px;padding-top:12px}
.icon{appearance:none;border:0;background:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.top h1{flex:1;margin:0;font-size:22px;line-height:1.5;font-weight:700}
.tr{display:block;direction:ltr;unicode-bidi:isolate;text-align:right;font:600 13px/1.4 var(--lat);color:var(--muted)}
.tr[hidden]{display:none}
.top .tr{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:999px;background:var(--datesoft);color:var(--date);font:800 15px/1 var(--lat);direction:ltr}
.trbtn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--s1);color:var(--muted);font:700 14px/1 var(--ui)}
.trbtn[aria-pressed=true]{background:var(--brandsoft);border-color:var(--brand);color:var(--brandink)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;direction:ltr}
.seg button{appearance:none;border:0;background:var(--s1);height:32px;padding:0 10px;font:800 12px/1 var(--lat);color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--onbrand)}
.stage{position:relative;border-radius:28px;background:radial-gradient(60% 18% at 50% 72%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 70%),var(--brandsoft);padding:8px 16px 16px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.stage #hero svg{position:relative;width:min(300px,78vw);height:auto;display:block}
.stage #hero svg.pop{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.stage #hero svg.pop{animation:none}}
.name{position:relative;margin:0;font:700 26px/1.4 var(--ar)}
.word{position:relative;display:flex;align-items:center;gap:8px;margin-top:6px;background:var(--s1);border:2px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 3px 0 var(--line)}
.word b{font:700 20px/1.6 var(--ar)}
.word .tr{margin:0}
.spk{appearance:none;border:0;flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;cursor:pointer}
.spk svg{display:block}
h2{margin:0;font-size:17px;line-height:1.5;font-weight:700}
.animals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ani{appearance:none;cursor:pointer;position:relative;border:2px solid var(--line);background:var(--s1);border-radius:18px;padding:4px 2px 6px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:3px}
.ani svg{width:100%;height:auto;display:block}
.ani span{font:700 13px/1.5 var(--ar)}
.ani[aria-checked=true]{border-color:var(--brand);background:var(--brandsoft);box-shadow:0 3px 0 var(--brand)}
.ani.locked svg{filter:grayscale(1) brightness(.92);opacity:.5}
.lock{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--s0);display:grid;place-items:center}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tab{appearance:none;flex:none;cursor:pointer;border:2px solid var(--line);background:var(--s1);border-radius:999px;padding:6px 14px;font:700 15px/1.5 var(--ui);color:var(--muted);display:flex;flex-direction:column;align-items:center}
.tab .tr{text-align:center;font-size:11px;line-height:1.2}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--s0)}
.tab[aria-selected=true] .tr{color:var(--s2)}
.sub{display:flex;gap:8px}
.sub .tab{font-size:14px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{appearance:none;cursor:pointer;position:relative;border:2px solid var(--line);background:var(--s1);border-radius:18px;padding:6px 4px 8px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;margin-bottom:3px;transition:transform 80ms}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt[aria-checked=true]{border-color:var(--brand);background:var(--brandsoft);box-shadow:0 3px 0 var(--brand)}
.opt svg{width:100%;height:auto;aspect-ratio:1;display:block}
.opt span{font:700 15px/1.6 var(--ar);text-align:center}
.opt span.tr,.ani span.tr{font:600 12px/1.3 var(--lat);text-align:center;color:var(--muted)}
.sw{width:64px;height:64px;border-radius:50%;margin:8px 0;border:4px solid var(--s1);box-shadow:0 0 0 2px var(--line2);background:linear-gradient(180deg,var(--c1) 58%,var(--c2) 58%)}
.none{width:100%;aspect-ratio:1;display:grid;place-items:center;color:var(--subtle)}
.price{position:absolute;top:6px;left:6px;display:inline-flex;align-items:center;gap:2px;padding:2px 7px;border-radius:999px;background:var(--datesoft);color:var(--date);font:800 12px/1.4 var(--lat);direction:ltr}
.owned{background:var(--goldsoft);color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;padding:28px 16px;border:2px dashed var(--line2);border-radius:18px;color:var(--muted)}
.empty b{display:block;font:700 18px/1.6 var(--ar);color:var(--ink)}
.bar{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--s0) 92%,transparent);backdrop-filter:blur(6px);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.btn{appearance:none;cursor:pointer;flex:1;min-height:52px;border:0;border-radius:14px;background:var(--brand);color:var(--onbrand);box-shadow:0 4px 0 var(--brand2);font:700 18px/1 var(--ui);display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.sec{flex:none;width:56px;background:var(--s1);color:var(--brandink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn .pill{height:28px;background:rgba(255,255,255,.2);color:inherit}
.opt.tier{border-color:var(--tc);box-shadow:0 3px 0 var(--tc)}
.opt.tier[aria-checked=true]{background:color-mix(in srgb,var(--tc) 16%,var(--s1));box-shadow:0 3px 0 var(--tc),0 0 0 3px color-mix(in srgb,var(--tc) 40%,transparent)}
.tierb{font:700 12px/1.5 var(--ui);color:var(--ink);background:color-mix(in srgb,var(--tc) 22%,var(--s1));padding:0 8px;border-radius:999px}
.lockb{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--s0);display:grid;place-items:center}
.ld{position:fixed;inset:0;z-index:20;background:var(--s0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.ld.on{opacity:1;pointer-events:auto}
.ld .st{width:200px}.ld .st svg{width:100%;height:auto;display:block}
.ld .mm-all{transform-box:view-box;transform-origin:256px 440px;animation:bob 1.4s ease-in-out infinite}
.ld .mm-front{transform-box:view-box;transform-origin:384px 300px;animation:wr .5s ease-in-out infinite alternate}
.ld .mm-eyes{transform-box:view-box;transform-origin:256px 236px;animation:bl 3.6s infinite}
.mm .mm-spark{animation:tw 1.6s ease-in-out infinite}
.dots{display:flex;gap:8px;direction:ltr}.dots i{width:12px;height:16px;background:var(--brand);clip-path:path('M6 0 C9 5 12 9 12 11 A6 6 0 0 1 0 11 C0 9 3 5 6 0 Z');opacity:.2;animation:ink 1.5s infinite}.dots i:nth-child(2){animation-delay:.25s}.dots i:nth-child(3){animation-delay:.5s}
.ld p{margin:0;font-weight:700;font-size:18px}
.tipc{background:var(--s1);border:2px solid var(--line);border-radius:20px;padding:10px 18px;text-align:center}.tipc b{display:block;font:700 26px/1.8 var(--ar)}
@keyframes bob{50%{transform:translateY(-10px)}}@keyframes wr{from{transform:rotate(-6deg)}to{transform:rotate(8deg) translate(-4px,6px)}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes ink{0%,100%{opacity:.2}40%{opacity:1;transform:translateY(4px)}}@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ld .mm-all,.ld .mm-front,.ld .mm-eyes,.dots i,.mm .mm-spark{animation:none}.dots i{opacity:.8}}
.toast{position:fixed;inset:auto 16px 96px 16px;max-width:448px;margin:0 auto;background:var(--ink);color:var(--s0);border-radius:16px;padding:12px 16px;text-align:center;font-weight:700;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
.toast.on{transform:none;opacity:1}
.toast .tr{color:var(--s2);text-align:center}
.note{font:600 12px/1.5 var(--lat);color:var(--subtle);text-align:center;direction:ltr}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="icon" aria-label="رجوع"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div style="flex:1"><h1>صَمِّمْ رَفِيقَكَ</h1><span class="tr" data-tr="title"></span></div>
    <span class="pill" id="bal" aria-label="تمر"></span>
    <button class="trbtn" id="trbtn" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="11" rx="2.5"/><path d="M10.5 10v7a2.5 2.5 0 0 0 2.5 2.5h6a2.5 2.5 0 0 0 2.5-2.5v-6A2.5 2.5 0 0 0 19 8.5h-5.5"/><path d="M5.5 11l2.5-6 2.5 6M6.3 9h3.4"/></svg>تَرْجَمَة</button>
  </header>
  <div id="langrow" hidden style="display:flex;justify-content:flex-end"><div class="seg" role="group" aria-label="language"><button data-lang="id">ID</button><button data-lang="en">EN</button></div></div>

  <section class="stage" aria-live="polite">
    <div id="hero"></div>
    <p class="name" id="aname"></p>
    <div class="word" id="word"></div>
  </section>

  <section>
    <h2>اخْتَرْ حَيَوَانَكَ <span class="tr" data-tr="pick"></span></h2>
    <div class="animals" role="radiogroup" id="animals" style="margin-top:8px"></div>
  </section>

  <section>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="sub" id="sub" hidden style="margin-top:6px"></div>
    <div class="grid" role="radiogroup" id="grid" style="margin-top:10px"></div>
  </section>
  <p class="note">Prototipe desain Midad · semua hewan memakai satu postur & anchor yang sama</p>
</div>
<div class="bar"><div class="in">
  <button class="btn sec" id="rand" aria-label="عشوائي"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c2 0 3.5-1.6 4.6-3.5M13.4 9.5C14.5 7.6 16 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
  <button class="btn" id="save"></button>
</div></div>
<div class="toast" id="toast" role="status"></div>
<div class="ld" id="ld" role="status" aria-live="polite"><div class="st" id="ldst"></div><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><p>جَارٍ الحِفْظُ…</p><div class="tipc"><span style="font-size:13px;color:var(--muted)">كَلِمَةُ اليَوْمِ</span><b lang="ar">مِدَادٌ</b><span class="tr" lang="id" style="text-align:center">tinta</span></div></div>

<script>
/* Midad — mascot system. One shared chibi posture for every animal:
   512 canvas, ground y=480, egg body (124..388 x, 166..440 y), eyes y=236 (x 216/296),
   nose y=272, mouth y=294, head-top y=176, hand anchor (392,262), neck y=330.
   Layers: shadow, tail+back-features, legs, back-limb, body, body-overlay (belly, pattern, muzzle, markings),
   outline, neck-item, eyes, nose, mouth/beak, head-item, front-limb, hand-item.
   Colours via CSS vars on <svg>: --mb body, --mbd body dark, --mbl belly/light, --ma accent. Outline #2a211a. */
(function (g) {
  const O = '#2a211a', TIP = '#3b2a1e', CREAM = '#fbf6ec', BEAK = '#8a5a3b', BEAKD = '#6b4329', PINK = '#f4a7b0';
  const SW = `stroke="${O}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"`;
  let uid = 0;

  const BODY_D = 'M 256 166 C 342 166 388 236 388 314 C 388 392 330 440 256 440 C 182 440 124 392 124 314 C 124 236 170 166 256 166 Z';
  const BELLY = `<path d="M 256 296 C 302 296 328 336 328 374 C 328 410 298 432 256 432 C 214 432 184 410 184 374 C 184 336 210 296 256 296 Z" fill="var(--mbl)"/>`;
  const CHEEKS = `<ellipse cx="190" cy="274" rx="16" ry="9" fill="#ef8f8f" opacity=".45"/><ellipse cx="322" cy="274" rx="16" ry="9" fill="#ef8f8f" opacity=".45"/>`;
  const SHADOW = `<ellipse cx="256" cy="478" rx="120" ry="12" fill="${O}" opacity=".12"/>`;

  // ---------- shared limbs ----------
  const WING_D = 'M 0 -62 C 34 -60 44 -10 34 30 C 30 48 24 60 16 70 L 10 62 L 4 76 L -4 64 L -12 74 L -16 60 C -28 48 -38 30 -36 10 C -40 -20 -32 -60 0 -62 Z';
  function wing(side, raised, id) {
    const cx = 256 + side * 128, cy = raised ? 300 : 322, rot = side * (raised ? -38 : -12);
    return `<g transform="translate(${cx} ${cy}) rotate(${rot})"><clipPath id="${id}"><path d="${WING_D}"/></clipPath>` +
      `<path d="${WING_D}" fill="var(--mbd)"/><g clip-path="url(#${id})">` +
      [4, 28, 52].map(y => `<rect x="-50" y="${y}" width="100" height="12" fill="${CREAM}"/><rect x="-50" y="${y + 12}" width="100" height="10" fill="${TIP}"/>`).join('') +
      `</g><path d="${WING_D}" fill="none" ${SW}/></g>`;
  }
  const PAW_D = 'M -18 -46 C -18 -58 18 -58 18 -46 L 20 30 C 20 50 -20 50 -20 30 Z';
  function paw(side, raised) {
    const cx = 256 + side * 126, cy = raised ? 292 : 330, rot = side * (raised ? -40 : -16);
    return `<g transform="translate(${cx} ${cy}) rotate(${rot})"><path d="${PAW_D}" fill="var(--mb)" ${SW}/>` +
      `<path d="M -8 40 L -8 32 M 0 42 L 0 33 M 8 40 L 8 32" stroke="${O}" stroke-width="4" stroke-linecap="round"/></g>`;
  }
  const LEGS = {
    bird: () => [222, 290].map(x => `<path d="M ${x} 430 L ${x} 468 M ${x - 16} 474 L ${x} 464 L ${x + 16} 474 M ${x} 464 L ${x} 476" fill="none" stroke="${BEAKD}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`).join(''),
    paw: () => [222, 290].map(x => `<path d="M ${x - 22} 410 L ${x - 22} 462 C ${x - 22} 478 ${x + 22} 478 ${x + 22} 462 L ${x + 22} 410 Z" fill="var(--mb)" ${SW}/><path d="M ${x - 6} 466 L ${x - 6} 474 M ${x + 6} 466 L ${x + 6} 474" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`).join('')
  };

  // ---------- shared face parts ----------
  const EX = [216, 296], EY = 236;
  const roundEye = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${O}" stroke-width="5"/><circle cx="${x + 2}" cy="${y + 2}" r="${r * 0.55}" fill="${O}"/><circle cx="${x + 6}" cy="${y - 4}" r="${r * 0.2}" fill="#fff"/>`;
  const arcEye = (x, y) => `<path d="M ${x - 16} ${y + 6} Q ${x} ${y - 16} ${x + 16} ${y + 6}" fill="none" stroke="${O}" stroke-width="7" stroke-linecap="round"/>`;
  const EYES = {
    round: () => EX.map(x => roundEye(x, EY, 22)).join(''),
    happy: () => EX.map(x => arcEye(x, EY)).join(''),
    sleepy: () => EX.map(x => `<circle cx="${x}" cy="${EY}" r="20" fill="#fff" stroke="${O}" stroke-width="5"/><circle cx="${x + 2}" cy="${EY + 6}" r="10" fill="${O}"/><path d="M ${x - 22} ${EY - 2} A 22 22 0 0 1 ${x + 22} ${EY - 2} Z" fill="var(--mbd)" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>`).join(''),
    star: () => EX.map(x => `<circle cx="${x}" cy="${EY}" r="22" fill="#e9b949" stroke="${O}" stroke-width="5"/><path d="M ${x} ${EY - 14} Q ${x + 3} ${EY - 3} ${x + 14} ${EY} Q ${x + 3} ${EY + 3} ${x} ${EY + 14} Q ${x - 3} ${EY + 3} ${x - 14} ${EY} Q ${x - 3} ${EY - 3} ${x} ${EY - 14} Z" fill="#fff"/>`).join(''),
    determined: () => EX.map((x, i) => roundEye(x, EY + 2, 20) + `<path d="M ${x - 22} ${EY - (i ? 34 : 24)} L ${x + 22} ${EY - (i ? 24 : 34)}" stroke="${O}" stroke-width="8" stroke-linecap="round"/>`).join(''),
    wink: () => roundEye(EX[0], EY, 22) + arcEye(EX[1], EY),
    dot: () => EX.map(x => `<circle cx="${x}" cy="${EY}" r="9" fill="${O}"/><circle cx="${x + 3}" cy="${EY - 3}" r="2.5" fill="#fff"/>`).join(''),
    sad: () => EX.map((x, i) => roundEye(x, EY + 4, 20) + `<path d="M ${x - 20} ${EY - (i ? 20 : 30)} L ${x + 20} ${EY - (i ? 30 : 20)}" stroke="${O}" stroke-width="7" stroke-linecap="round"/>`).join(''),
    up: () => EX.map(x => `<circle cx="${x}" cy="${EY}" r="22" fill="#fff" stroke="${O}" stroke-width="5"/><circle cx="${x + 4}" cy="${EY - 8}" r="11" fill="${O}"/><circle cx="${x + 7}" cy="${EY - 12}" r="4" fill="#fff"/>`).join(''),
    lashes: () => EX.map((x, i) => roundEye(x, EY, 22) + [-1, 0, 1].map(k => { const s = i ? 1 : -1, a = (-90 + s * 35 + k * 22) * Math.PI / 180; return `<path d="M ${x + Math.cos(a) * 24} ${EY + Math.sin(a) * 24} L ${x + Math.cos(a) * 36} ${EY + Math.sin(a) * 36}" stroke="${O}" stroke-width="5" stroke-linecap="round"/>`; }).join('')).join('')
  };
  const BEAKS = {
    long: () => `<path d="M 240 258 Q 256 250 272 258 Q 270 300 258 346 Q 254 352 252 344 Q 244 300 240 258 Z" fill="${BEAK}" ${SW}/><path d="M 247 266 Q 252 300 255 330" stroke="#b07a52" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    smile: () => `<path d="M 238 258 Q 256 250 274 258 Q 272 286 260 314 Q 256 318 252 314 Q 240 286 238 258 Z" fill="${BEAK}" ${SW}/><path d="M 236 276 Q 256 292 276 276" fill="none" stroke="${O}" stroke-width="5" stroke-linecap="round"/>`,
    short: () => `<path d="M 236 258 Q 256 248 276 258 Q 276 282 256 298 Q 236 282 236 258 Z" fill="${BEAK}" ${SW}/>`,
    laugh: () => `<path d="M 238 256 Q 256 248 274 256 L 262 300 Q 256 304 250 300 Z" fill="${BEAK}" ${SW}/><path d="M 242 300 Q 256 324 270 300 Q 256 306 242 300 Z" fill="#f28b8b" ${SW}/><path d="M 244 318 Q 256 346 268 318" fill="${BEAKD}" ${SW}/>`
  };
  const NOSES = {
    tri: () => `<path d="M 244 266 L 268 266 L 256 280 Z" fill="${PINK}" stroke="${O}" stroke-width="5" stroke-linejoin="round"/>`,

let owned = new Set(store.get('owned',['skin:none','hand:none','hand:qalam','hand:inkpot','hand:book','head:none','neck:none']));
let cfg = Object.assign(M.defaults('hudhud'), store.get('cfg',{}));
if (cfg.animal !== 'hudhud') cfg = M.defaults('hudhud');
let tab = 'skin', sub = 'hand', lastWord = ['هُدْهُدٌ','Hudhud','Hoopoe'];
const $ = (id) => document.getElementById(id);
const tr = (arr) => arr[lang === 'en' ? 2 : 1];
const trSpan = (arr, cls) => `<span class="tr${cls ? ' ' + cls : ''}" lang="${lang}" ${trOn ? '' : 'hidden'}>${tr(arr)}</span>`;

function animalDef(){ return M.ANIMALS[cfg.animal]; }
function skinLock(){ const k = SKINS[cfg.skin || 'none']; return k && k[5] && !owned.has('skin:' + cfg.skin) ? k[5] : null; }
function cost(){ let c = 0; const sk = SKINS[cfg.skin || 'none']; if (sk && sk[1] && !owned.has('skin:' + cfg.skin)) c += sk[1]; for (const s of ['hand','head','neck']) { const it = ITEMS[s][cfg[s]]; if (it && !owned.has(s + ':' + cfg[s])) c += it[0]; } return c; }

function renderHero(pop){
  const hero = $('hero'); hero.innerHTML = M.render(cfg, { label: ANIMALS.find(a => a[0] === cfg.animal)[1] });
  if (pop) { const s = hero.firstChild; s.classList.add('pop'); }
  const a = ANIMALS.find(a => a[0] === cfg.animal);
  $('aname').innerHTML = a[1] + trSpan([a[1], a[2], a[3]]);
  $('word').innerHTML = `<b lang="ar">${lastWord[0]}</b>${trSpan(lastWord)}<button class="spk" id="spk" aria-label="اسْتَمِعْ">${SPK_SVG}</button>`;
  $('spk').onclick = () => { try { const u = new SpeechSynthesisUtterance(lastWord[0]); u.lang = 'ar-SA'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };
}
function renderAnimals(){
  $('animals').innerHTML = ANIMALS.map(([id, ar, idn, en, lock]) => `<button class="ani ${lock ? 'locked' : ''}" role="radio" aria-checked="${cfg.animal === id}" data-a="${id}" aria-label="${ar}${lock ? ' — مُغْلَقٌ' : ''}">${lock ? `<span class="lock">${LOCK_SVG}</span>` : ''}${M.render({ animal: id })}<span>${ar}</span></button>`).join('');
}
function renderTabs(){
  $('tabs').innerHTML = SLOTS.map(([id, ar, a, b]) => { const lab = id === 'mouth' && animalDef().mouthKind === 'beak' ? ['المِنْقَارُ','Paruh','Beak'] : [ar, a, b]; return `<button class="tab" role="tab" aria-selected="${tab === id}" data-t="${id}">${lab[0]}${trSpan(lab)}</button>`; }).join('');
  const sb = $('sub'); sb.hidden = tab !== 'items';
  sb.innerHTML = SUBS.map(([id, ar, a, b]) => `<button class="tab" role="tab" aria-selected="${sub === id}" data-s="${id}">${ar}${trSpan([ar, a, b])}</button>`).join('');
}
function optTile(slot, key, words, preview, priceVal){
  const sel = String(cfg[slot]) === String(key);
  const price = priceVal ? (owned.has(slot + ':' + key) ? '' : `<span class="price">${DATE_SVG}${priceVal}</span>`) : '';
  return `<button class="opt" role="radio" aria-checked="${sel}" data-slot="${slot}" data-k="${key}">${price}${preview}<span lang="ar">${words[0]}</span>${trSpan(words)}</button>`;
}
function renderGrid(){
  const A = animalDef(), g = $('grid'); let h = '';
  if (tab === 'skin') h = Object.entries(SKINS).map(([k, d]) => { const sel = (cfg.skin || 'none') === k, t = TIER[d[0]], own = owned.has('skin:' + k);
    const badge = d[1] && !own ? `<span class="price">${DATE_SVG}${d[1]}</span>` : (d[5] && !own ? `<span class="lockb">${LOCK_SVG}</span>` : '');
    return `<button class="opt tier" style="--tc:${t[1]}" role="radio" aria-checked="${sel}" data-slot="skin" data-k="${k}">${badge}${k === 'none' ? `<span class="none">${NONE_SVG}</span>` : M.render(Object.assign({}, cfg, { skin: k }), { viewBox: '96 150 320 320' })}<span lang="ar">${d[2]}</span>${t[0] ? `<span class="tierb">${t[0]}</span>` : ''}${trSpan([d[2], d[3], d[4]])}</button>`; }).join('');
  if (tab === 'color') h = Object.entries(A.colors).map(([k, c]) => optTile('color', k, COLORN[k], `<span class="sw" style="--c1:${c[0]};--c2:${c[2]}"></span>`)).join('');
  if (tab === 'style') h = A.styles.map(k => optTile('style', k, STYLEN[k], M.render(Object.assign({}, cfg, { style: k, head: 'none' }), { viewBox: CROP.style }))).join('');
  if (tab === 'eyes') h = Object.keys(EYEN).map(k => optTile('eyes', k, EYEN[k], M.render(Object.assign({}, cfg, { eyes: k }), { viewBox: CROP.eyes }))).join('');
  if (tab === 'nose') h = A.hasNose ? Object.keys(NOSEN).map(k => optTile('nose', k, NOSEN[k], M.render(Object.assign({}, cfg, { nose: k }), { viewBox: CROP.nose }))).join('')
    : `<div class="empty"><b lang="ar">${T.nonose[0]}</b>${trSpan(T.nonose)}<div style="margin-top:6px">${T.nonoseb[0]}</div>${trSpan(T.nonoseb)}</div>`;
  if (tab === 'mouth') { const N = A.mouthKind === 'beak' ? BEAKN : MOUTHN; h = Object.keys(N).map(k => optTile('mouth', k, N[k], M.render(Object.assign({}, cfg, { mouth: k }), { viewBox: CROP.mouth }))).join(''); }
  if (tab === 'items') h = Object.entries(ITEMS[sub]).map(([k, it]) => optTile(sub, k, [it[1], it[2], it[3]], k === 'none' ? `<span class="none">${NONE_SVG}</span>` : M.render(Object.assign({}, cfg, { [sub]: k }), { viewBox: CROP[sub] }), it[0])).join('');
  g.innerHTML = h;
}
function renderBar(){
  const a = ANIMALS.find(x => x[0] === cfg.animal);
  $('bal').innerHTML = DATE_SVG + balance;
  const sl = skinLock(); if (!a[4] && sl) { $('save').disabled = true; $('save').style.opacity = '.75'; $('save').innerHTML = LOCK_SVG + ' ' + sl[0]; return; }
  if (a[4]) { $('save').disabled = true; $('save').style.opacity = '.75'; $('save').innerHTML = LOCK_SVG + ' ' + a[4][0]; return; }
  $('save').disabled = false; $('save').style.opacity = '';
  const c = cost();
  $('save').innerHTML = c ? `${T.buy[0]} <span class="pill">${DATE_SVG}${c}</span>` : T.save[0];
  $('bal').innerHTML = DATE_SVG + balance;
}
function renderTr(){
  document.querySelectorAll('[data-tr]').forEach(e => { e.textContent = tr(T[e.dataset.tr]); e.lang = lang; e.hidden = !trOn; });
  $('trbtn').setAttribute('aria-pressed', trOn);
  $('langrow').hidden = !trOn;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
}
function all(pop){ renderHero(pop); renderAnimals(); renderTabs(); renderGrid(); renderBar(); renderTr(); }
let toastT;
function toast(arr){ const t = $('toast'); t.innerHTML = arr[0] + `<span class="tr" lang="${lang}">${tr(arr)}</span>`; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

document.addEventListener('click', (e) => {
  const ani = e.target.closest('.ani');
  if (ani) { const a = ANIMALS.find(x => x[0] === ani.dataset.a); cfg = M.defaults(a[0]); lastWord = [a[1], a[2], a[3]]; if (tab === 'nose' && !M.ANIMALS[a[0]].hasNose) tab = 'color'; all(true); if (a[4]) toast(a[4]); return; }
  const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; renderTabs(); renderGrid(); renderTr(); return; }
  const s = e.target.closest('[data-s]'); if (s) { sub = s.dataset.s; renderTabs(); renderGrid(); renderTr(); return; }
  const o = e.target.closest('.opt');
  if (o) { const slot = o.dataset.slot, k = o.dataset.k; cfg[slot] = k;
    if (slot === 'skin') { const d = SKINS[k]; lastWord = [d[2], d[3], d[4]]; renderHero(true); renderGrid(); renderBar(); renderTr(); if (d[5] && !owned.has('skin:' + k)) toast(d[5]); return; }
    const map = { color: COLORN, style: STYLEN, eyes: EYEN, nose: NOSEN, mouth: animalDef().mouthKind === 'beak' ? BEAKN : MOUTHN };
    lastWord = map[slot] ? map[slot][k] : (k === 'none' ? ['لَا شَيْءَ','Tidak ada','None'] : [ITEMS[slot][k][1], ITEMS[slot][k][2], ITEMS[slot][k][3]]);
    renderHero(true); renderGrid(); renderBar(); renderTr(); return; }
});
$('trbtn').onclick = () => { trOn = !trOn; all(false); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('lang', lang); all(false); });
$('rand').onclick = () => { const A = animalDef(), pick = (o) => { const k = Array.isArray(o) ? o : Object.keys(o); return k[Math.floor(Math.random() * k.length)]; };
  cfg.color = pick(A.colors); cfg.style = pick(A.styles); cfg.eyes = pick(EYEN); cfg.mouth = pick(A.mouthKind === 'beak' ? BEAKN : MOUTHN); if (A.hasNose) cfg.nose = pick(NOSEN);
  lastWord = COLORN[cfg.color]; all(true); };
$('save').onclick = () => { const c = cost(); if (c > balance) { toast(T.poor); return; }
  balance -= c; for (const s of ['hand','head','neck']) owned.add(s + ':' + cfg[s]); owned.add('skin:' + (cfg.skin || 'none'));
  store.set('bal', balance); store.set('owned', [...owned]); store.set('cfg', cfg);
  const ld = $('ld'); $('ldst').innerHTML = M.render(cfg); ld.classList.add('on');
  setTimeout(() => { ld.classList.remove('on'); renderGrid(); renderBar(); renderTr(); toast(T.saved); }, 1600); };
all(false);
}
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>ProgressBar — preview</title></head>
<body>
<div class="md-demo" style="max-width:440px">
  <div class="md-col" style="width:100%">
    <span class="md-cap">Header pelajaran (RTL: tombol keluar di kanan, isi dari kanan)</span>
    <div class="md-lessonbar"><button class="md-close" aria-label="خُرُوج"><svg class="md-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="md-progress" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><div class="md-progress__fill" style="width:60%"></div></div><span class="md-pill md-pill--lantern"><svg class="md-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2h4v2h-4z"/><path d="M8 5h8l1.5 3v8L16 20H8l-1.5-4V8z"/><path d="M9 21h6v1.5H9z"/><path d="M12 9c1.6 1.6 2 2.7 2 3.6a2 2 0 0 1-4 0c0-.9.4-2 2-3.6z" fill="#fff" opacity=".85"/></svg>5</span></div>
    <span class="md-cap">Varian emas (target XP harian)</span>
    <div class="md-progress md-progress--gold" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="50"><div class="md-progress__fill" style="width:60%"></div></div>
  </div>
</div>
</body>
</html>

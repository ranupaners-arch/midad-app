<!-- @dsCard group="Peta" height=1200 subtitle="Roadmap rute ID & EN" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>RihlahRoadmap — preview</title></head>
<body>
<div class="md-demo" style="display:block;max-width:520px">
 <div class="md-road__seg" role="group" aria-label="route"><button data-r="id" aria-pressed="true">ID · Nusantara</button><button data-r="en" aria-pressed="false">EN · Britain</button></div>
 <div class="md-road" id="road"></div>
</div>
<script src="../../assets/maskot/mascot.js"></script>
<script src="../../assets/maskot/vehicles.js"></script>
<script>
// Data dari assets/rihlah/routes.json (sumber tunggal).
var MARHALAH = ['','المَرْحَلَةُ الأُولَى','المَرْحَلَةُ الثَّانِيَةُ','المَرْحَلَةُ الثَّالِثَةُ','المَرْحَلَةُ الرَّابِعَةُ'], HALF = ['','النِّصْفُ الأَوَّلُ','النِّصْفُ الثَّانِي'];
var TEST = { nisfi: 'الاخْتِبَارُ النِّصْفِيُّ', nihai: 'الاخْتِبَارُ النِّهَائِيُّ' };
var N = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; function ar(n) { return String(n).replace(/[0-9]/g, function (d) { return N[d]; }); }
var D;
function draw(r) {
  document.getElementById('road').innerHTML = D.routes[r].map(function (g) {
    var chips = '';
    if (g.levels[0] === D.arabArrivalLevel) chips += '<span class="md-chip md-chip--arab">🌙 الوُصُولُ إِلَى بِلَادِ العَرَبِ</span>';
    if (g.levels[0] === D.noTashkeelFromLevel) chips += '<span class="md-chip md-chip--tash">بِدُونِ تَشْكِيلٍ</span>';
    chips += '<span class="md-chip md-chip--test">' + TEST[g.test] + '</span>';
    return '<div class="md-leg"><div class="md-leg__v">' + MidadVehicles.ride(g.vehicle, { animal: 'hudhud' }) + '</div><div><span class="md-leg__k">' + MARHALAH[g.marhalah] + ' · ' + HALF[g.half] + ' · المُسْتَوَى ' + ar(g.levels[0]) + '–' + ar(g.levels[1]) + '</span><p class="md-leg__r">' + g.region.ar + '</p><span class="md-tr md-tr--sm" lang="' + r + '">' + g.region[r] + ' · ' + MidadVehicles.V[g.vehicle].name[r === 'en' ? 2 : 1] + '</span><div class="md-leg__p">' + g.ports.join(' → ') + '</div><div class="md-leg__chips">' + chips + '</div></div></div>';
  }).join('');
  document.querySelectorAll('[data-r]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.r === r); });
}
fetch('../../assets/rihlah/routes.json').then(function (res) { return res.json(); }).then(function (data) {
  D = data;
  document.querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { draw(b.dataset.r); }; });
  draw('id');
}).catch(function () {
  document.getElementById('road').textContent = 'Gagal memuat routes.json (buka lewat npm run preview:ds).';
});
</script>
</body>
</html>
